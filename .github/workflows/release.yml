name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-and-release:
    name: Verify Tag and Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Tag matches VERSION
        run: |
          FILE_VERSION="v$(tr -d '[:space:]' < VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME}"
          echo "VERSION file: ${FILE_VERSION}"
          echo "Tag: ${TAG_VERSION}"
          if [ "${FILE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Error: Tag ${TAG_VERSION} does not match VERSION file ${FILE_VERSION}"
            exit 1
          fi

      - name: Verify Tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: Tag commit is not an ancestor of main"
            exit 1
          fi

      # The default Azure Ubuntu mirror can stall apt for many minutes (each
      # package waits 20 s and is skipped), so apt uses the Kakao mirror. The
      # runner image does not name the archive in ubuntu.sources: its URIs line
      # is mirror+file:/etc/apt/apt-mirrors.txt, a mirror list whose first entry
      # is azure.archive.ubuntu.com. Both the list and every URI are rewritten.
      - name: Use the Kakao APT mirror
        run: |
          KAKAO=https://mirror.kakao.com/ubuntu/
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "$KAKAO" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$f" ]; then
              sudo sed -i -E \
                -e "s#mirror\+file:/etc/apt/apt-mirrors\.txt#${KAKAO}#g" \
                -e "s#https?://([a-z0-9.-]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#${KAKAO}#g" "$f"
            fi
          done
          grep -rhE '^(URIs:|deb )' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libgl1-mesa-dev libx11-dev

      - name: Build and test (Linux Release)
        run: |
          cmake --preset linux-x64-release
          cmake --build build/linux-x64-release
          ctest --test-dir build/linux-x64-release --output-on-failure

      - name: Check release notes and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "${RELEASE_NOTE}" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${RELEASE_NOTE}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
