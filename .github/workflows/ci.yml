name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    name: Windows Win64 (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          $preset = if ("${{ matrix.config }}" -eq "Debug") { "win64-debug" } else { "win64-release" }
          cmake --preset $preset

      - name: Build
        run: |
          $preset = if ("${{ matrix.config }}" -eq "Debug") { "win64-debug" } else { "win64-release" }
          cmake --build "build/$preset" --config ${{ matrix.config }}

      - name: Test
        run: |
          $preset = if ("${{ matrix.config }}" -eq "Debug") { "win64-debug" } else { "win64-release" }
          ctest --test-dir "build/$preset" -C ${{ matrix.config }} --output-on-failure

  build-linux:
    name: Linux x64 (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libgl1-mesa-dev libx11-dev

      - name: Configure CMake
        run: |
          PRESET="linux-x64-$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')"
          cmake --preset "${PRESET}"

      - name: Build
        run: |
          PRESET="linux-x64-$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')"
          cmake --build "build/${PRESET}"

      - name: Test
        run: |
          PRESET="linux-x64-$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')"
          ctest --test-dir "build/${PRESET}" --output-on-failure
