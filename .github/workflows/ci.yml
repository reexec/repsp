name: CI

# Every push to main and every pull request into main builds the project and
# runs the probes (CTest). A task branch can be checked by hand before a pull
# request exists: gh workflow run ci.yml --ref <branch>.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Win64 (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          $preset = if ("${{ matrix.config }}" -eq "Debug") { "win64-debug" } else { "win64-release" }
          cmake --preset $preset

      - name: Build
        run: |
          $preset = if ("${{ matrix.config }}" -eq "Debug") { "win64-debug" } else { "win64-release" }
          cmake --build "build/$preset" --config ${{ matrix.config }}

      - name: Test
        run: |
          $preset = if ("${{ matrix.config }}" -eq "Debug") { "win64-debug" } else { "win64-release" }
          ctest --test-dir "build/$preset" -C ${{ matrix.config }} --output-on-failure

  build-linux:
    name: Linux x64 (${{ matrix.config }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The default Azure Ubuntu mirror can stall apt for many minutes, so apt
      # uses the Kakao mirror instead. ubuntu-24.04 keeps its sources in the
      # deb822 file ubuntu.sources; the legacy sources.list is rewritten too in
      # case an image still has entries there.
      - name: Use the Kakao APT mirror
        run: |
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$f" ]; then
              sudo sed -i -E 's#https?://([a-z0-9.-]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirror.kakao.com/ubuntu/#g' "$f"
            fi
          done
          grep -rhE '^(URIs:|deb )' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libgl1-mesa-dev libx11-dev

      - name: Configure CMake
        run: |
          PRESET="linux-x64-$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')"
          cmake --preset "${PRESET}"

      - name: Build
        run: |
          PRESET="linux-x64-$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')"
          cmake --build "build/${PRESET}"

      - name: Test
        run: |
          PRESET="linux-x64-$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')"
          ctest --test-dir "build/${PRESET}" --output-on-failure
